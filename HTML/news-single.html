<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title will be set dynamically by JavaScript -->
    <title>News & Events | Elif Pu Collage</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><img src="/images/ALIF.png" alt="Logo" style="width: 40px; height: 40px;"> Elif Pu Collage</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/admission-form.html">Admissions</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/HTML/news.html">News & Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/portal_login.html">Admin Portal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/Student Results.html">Student Results</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Section -->
    <div class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8" id="article-content">
                <!-- The full article will be loaded here by JavaScript -->
                <div class="text-center">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-4">
        <div class="container"><p>&copy; 2024 Elif Pu Collage. All Rights Reserved.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('article-content');
            
            // Get the article ID from the URL (e.g., ...?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                container.innerHTML = '<div class="alert alert-danger">Error: No article ID was specified in the URL.</div>';
                return;
            }

            try {
                const response = await fetch(`/api/news/${articleId}`);
                if (!response.ok) throw new Error('The requested article could not be found.');
                const article = await response.json();
                
                // Update the page title to the article's title
                document.title = `${article.title} | Elif Pu Collage`;

                // Render the full article content
                // .replace(/\n/g, '<br>') converts newline characters from the textarea into HTML line breaks
                container.innerHTML = `
                    <h1 class="display-5 fw-bold mb-3">${article.title}</h1>
                    <p class="text-muted border-bottom pb-3 mb-4">Published on ${article.publishdate}</p>
                    <img src="${article.imageurl || '/images/default-news.jpg'}" class="img-fluid rounded shadow-sm mb-4" alt="${article.title}">
                    <div class="article-body fs-5">
                        ${article.content.replace(/\n/g, '<p></p>')}
                    </div>
                    <hr class="my-4">
                    <a href="news.html" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Back to All News</a>
                `;

            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                console.error('Fetch Article Error:', error);
            }
        });
    </script>
</body>
</html>
