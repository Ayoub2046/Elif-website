<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records | Admin Panel</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3><img src="/images/ALIF.png" style="width: 60px; height: 60px; border-radius: 50px;" alt=""><span
                        style="font-size: 20px;">Elif Pu Collage</span></h3>
            </div>
            <ul class="sidebar-nav">
                <li><a href="admin.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a href="user.html"><i class="fas fa-users-cog"></i> <span>User Management</span></a></li>
                <li><a href="student.html" class="active"><i class="fas fa-user-graduate"></i> <span>Student
                            Records</span></a></li>
                <li><a href="teacher.html"><i class="fas fa-chalkboard-teacher"></i> <span>Teacher Management</span></a>
                </li>
                <li><a href="admissions-admin.html"><i class="fas fa-file-signature"></i> <span>Manage
                            Admissions</span></a></li>
                <!-- Add other links back here as needed -->
                <li><a href="index.html" id="logout-link"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
                </li>
            </ul>
        </nav>
        <!-- Main Content -->
        <div class="main-content">
            <nav class="top-navbar">
                
                <h4 class="mb-0 ms-3">Student Records</h4>
                <button class="btn btn-primary" id="sidebar-toggler" type="button"><i class="fas fa-bars"></i></button>
            </nav>
            <div class="content-area">
                <div class="card main-table-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="m-0">All Students</h6>
                        <button class="btn btn-primary btn-sm" id="btn-add-student"><i class="fas fa-plus me-1"></i> Add
                            New Student</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Grade</th>
                                        <th>Enrollment Date</th>
                                        <th>Birth Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Modal -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="studentForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="studentModalTitle">Student Information</h5><button type="button"
                            class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Grade</label>
                                <input type="text" name="grade" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Attendance (%)</label>
                                <input type="number" name="attendance" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Enrollment Date</label>
                                <input type="date" name="enrollmentDate" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Birth Date</label>
                                <input type="date" name="birthDate" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Close</button><button type="submit" class="btn btn-primary">Save
                            Changes</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentModal = new bootstrap.Modal(document.getElementById('studentModal'));
            const studentForm = document.getElementById('studentForm');
            const API_URL = '/api/students';
            let students = [];

            async function fetchStudents() {
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Failed to fetch');
                    students = await response.json();
                    renderStudents();
                } catch (error) {
                    console.error('Fetch Error:', error);
                    document.getElementById('student-table-body').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>`;
                }
            }

            function renderStudents() {
                const tbody = document.getElementById('student-table-body');
                if (students.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No students found. Click 'Add New Student' to begin.</td></tr>`;
                    return;
                }
                tbody.innerHTML = students.map(s => `
                <tr>
                    <td>ELP${250000 + s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.grade}</td>
                    <td>${s.enrollmentDate}</td>
                    <td>${s.birthDate}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-view" data-id="${s.id}"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-edit" data-id="${s.id}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-delete" data-id="${s.id}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join('');
            }

            document.getElementById('btn-add-student').addEventListener('click', () => {
                document.getElementById('studentModalTitle').textContent = 'Add New Student';
                studentForm.reset();
                studentForm.dataset.mode = 'add';
                delete studentForm.dataset.id;
                studentModal.show();
            });

            document.getElementById('student-table-body').addEventListener('click', e => {
                const button = e.target.closest('button');
                if (!button) return;
                const id = parseInt(button.dataset.id);
                const student = students.find(s => s.id === id);

                if (button.classList.contains('btn-edit')) {
                    document.getElementById('studentModalTitle').textContent = 'Edit Student';
                    studentForm.dataset.mode = 'edit';
                    studentForm.dataset.id = student.id;
                    studentForm.elements.name.value = student.name;
                    studentForm.elements.grade.value = student.grade;
                    studentForm.elements.attendance.value = student.attendance || '';
                    studentForm.elements.enrollmentDate.value = student.enrollmentDate;
                    studentForm.elements.birthDate.value = student.birthDate;
                    studentModal.show();
                } else if (button.classList.contains('btn-delete')) {
                    if (confirm(`Are you sure you want to delete ${student.name}?`)) {
                        fetch(`${API_URL}/${id}`, { method: 'DELETE' }).then(() => fetchStudents());
                    }
                } else if (button.classList.contains('btn-view')) {
                    sessionStorage.setItem('viewingStudentId', student.id);
                    sessionStorage.setItem('viewingStudentBirthDate', student.birthDate);
                    window.open('student_result.html', '_blank');
                }
            });

            studentForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const mode = studentForm.dataset.mode;
                const id = studentForm.dataset.id;
                const studentData = {
                    name: studentForm.elements.name.value,
                    grade: studentForm.elements.grade.value,
                    enrollmentDate: studentForm.elements.enrollmentDate.value,
                    birthDate: studentForm.elements.birthDate.value,
                    attendance: parseInt(studentForm.elements.attendance.value) || null
                };

                let url = API_URL;
                let method = 'POST';
                if (mode === 'edit') {
                    url = `${API_URL}/${id}`;
                    method = 'PUT';
                }

                try {
                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData),
                    });
                    if (!response.ok) throw new Error('Save operation failed');
                    await fetchStudents();
                    studentModal.hide();
                } catch (error) {
                    alert(`Error saving student: ${error.message}`);
                }
            });

            fetchStudents();
        });



        // Add this code inside your main <script> tag at the bottom of each admin page

document.addEventListener('DOMContentLoaded', () => {
    
    // --- START: COMMON CODE FOR ALL ADMIN PAGES ---

    // 1. Responsive Sidebar Toggler Functionality
    const sidebar = document.querySelector('.sidebar');
    const sidebarToggler = document.getElementById('sidebar-toggler');
    if (sidebarToggler) {
        sidebarToggler.addEventListener('click', () => {
            sidebar.classList.toggle('toggled');
        });
    }

    // 2. Security & Logout
    if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
        window.location.href = 'admin-login.html';
    }
    const logoutLinks = document.querySelectorAll('#logout-link, #logout-link-dropdown');
    logoutLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.removeItem('isAdminLoggedIn');
            sessionStorage.removeItem('adminProfile');
            window.location.href = 'admin-login.html';
        });
    });

    // --- END: COMMON CODE FOR ALL ADMIN PAGES ---


    // --- PAGE-SPECIFIC LOGIC GOES BELOW ---
    // For example, on student.html, your code to fetch students starts here.
    // On teacher.html, your code to fetch teachers starts here.
    // etc.

});
    </script>
</body>

</html>
