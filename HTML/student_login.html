<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f510e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Elif PU College">
    <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Login | ELIF PU COLLEGE</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="login-container">
        <div class="card login-card shadow-lg">
            <div class="login-header">
                <img src="/images/ALIF.png" alt="School Logo" class="login-logo">
                <h3>Student Results Portal</h3>
                <p>Enter your credentials to view your report card</p>
            </div>
            <div class="login-body">
                <div id="login-alert" class="text-center mb-3"></div>

                <form id="student-login-form" autocomplete="off">
                    <div class="mb-3">
                        <label for="studentId" class="form-label">Student ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-id-card text-secondary"></i></span>
                            <input type="text" class="form-control" id="studentId" placeholder="e.g., ELP250000" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password (Date of Birth)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="YYYY-MM-DD" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-file-alt me-2"></i>View Results
                        </button>
                    </div>
                    <div class="login-footer">
                        <a href="/HTML/index.html"><i class="fas fa-arrow-left me-1"></i>Back to Website</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Ensure there is at least one student in localStorage for testing
        if (!localStorage.getItem('allStudentResults')) {
            localStorage.setItem('allStudentResults', JSON.stringify({
                "Cis231666": {
                    "password": "2005-01-01",
                    "name": "Ayuob Aadan Abdi",
                    "results": {
                        "Math": "A+",
                        "English": "B+"
                    }
                }
            }));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('student-login-form');
            const loginAlert = document.getElementById('login-alert');

            // This script now correctly loads the data that your admin panel saves.
            const resultsData = JSON.parse(localStorage.getItem('allStudentResults'));

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const studentId = document.getElementById('studentId').value.toUpperCase();
                const password = document.getElementById('password').value;

                // Clear previous alerts
                loginAlert.innerHTML = '';

                if (!resultsData) {
                    loginAlert.innerHTML = `<div class="alert alert-warning">Error: No student data found. Please contact administration.</div>`;
                    return;
                }

                const student = resultsData[studentId];

                // Check if the student exists AND the password matches.
                if (student && student.password === password) {
                    // Success! Save the "permission ticket" to view the results.
                    sessionStorage.setItem('viewingStudentId', studentId);
                    // Redirect to the results page.
                    window.location.href = 'student-result.html';
                } else {
                    // Show the "Invalid ID or Password" error.
                    loginAlert.innerHTML = `<div class="alert alert-danger">Invalid ID or Password.</div>`;
                }
            });
        });
    </script>

    <script src="/js/pwa.js"></script>
</body>

</html>
