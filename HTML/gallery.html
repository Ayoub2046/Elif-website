<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Elif Pu Collage</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .gallery-item iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: 0.375rem 0.375rem 0 0; /* Match card-img-top radius */
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/HTML/index.html"><img src="/images/ALIF.png" alt="Logo" style="width: 40px; height: 40px;"> Elif Pu Collage</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/HTML/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/admision.html">Admissions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/news.html">News & Events</a></li>
                    <!-- Add other public links here... -->
                    <li class="nav-item"><a class="nav-link active" href="/HTML/gallery.html">Gallery</a></li>
                    <!-- <li class="nav-item"><a class="nav-link" href="/HTML/portal_login.html">Admin Portal</a></li> -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Section -->
    <div class="container my-5 py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">School Gallery</h1>
            <p class="lead text-muted">A glimpse into the vibrant life at Elif Pu Collage.</p>
        </div>
        <div id="gallery-container" class="row g-4">
            <!-- Media items will be loaded here by JavaScript -->
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-4">
        <div class="container"><p>&copy; 2024 Elif Pu Collage. All Rights Reserved.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('gallery-container');
            try {
                const response = await fetch('/api/gallery');
                const items = await response.json();
                if (items.length === 0) {
                    container.innerHTML = '<p class="text-center fs-5 text-muted">No media has been uploaded to the gallery yet.</p>';
                    return;
                }
                container.innerHTML = items.map(item => {
                    const mediaElement = item.type === 'Video'
                        ? `<iframe src="${item.mediaurl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
                        : `<img src="${item.mediaurl}" class="card-img-top" alt="${item.title}">`;
                    
                    return `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm gallery-item">
                            ${mediaElement}
                            <div class="card-body">
                                <h5 class="card-title">${item.title}</h5>
                                ${item.description ? `<p class="card-text">${item.description}</p>` : ''}
                            </div>
                            <div class="card-footer text-muted">
                                ${item.category || 'General'} - ${item.uploaddate}
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error fetching gallery:', error);
                container.innerHTML = '<p class="text-center text-danger">Could not load the gallery at this time.</p>';
            }
        });
    </script>
</body>
</html>
