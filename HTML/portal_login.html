<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Login</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <!-- ... (your head content) ... -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="/images/ALIF.png" alt="Logo" style="width: 60px; height: 60px;">
                    <h3 class="mt-3 fw-bold">Portal Login</h3>
                    <p class="text-muted">Please sign in to continue.</p>
                </div>
                <div id="login-alert"></div>
                <form id="login-form">
                    <div class="mb-3"><label class="form-label">Email Address</label><input type="text" class="form-control" id="email" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
                    <div class="d-grid"><button type="submit" class="btn btn-primary">Login</button></div>
                </form>
                <div class="text-center mt-3"><a href="/HTML/index.html">Back to Website</a></div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('login-form');
        const loginAlert = document.getElementById('login-alert');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginAlert.innerHTML = '';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || 'Invalid email or password.');
                }
                const { user } = result;
                sessionStorage.setItem('activeUser', JSON.stringify({ loggedIn: true, role: user.role, name: user.name, email: user.email, id: user.id }));
                if (user.role === 'Admin') {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    window.location.href = 'admin.html';
                } else if (user.role === 'Teacher') {
                    window.location.href = 'teacher-dashboard.html';
                } else if (user.role === 'Parent') {
                    window.location.href = 'parent-dashboard.html';
                } else {
                    throw new Error('This user role does not have a dashboard.');
                }
            } catch (error) {
                loginAlert.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        });
    });
</script>
</body>
</html>
