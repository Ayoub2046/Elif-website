<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Login | ELIF PU COLLEGE</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card shadow-lg">
            <div class="login-header">
                <img src="/images/ALIF.png" alt="School Logo" class="login-logo">
                <h3>Student Results Portal</h3>
                <p>Enter your credentials to view your report card</p>
            </div>
            <div class="login-body">
                <div id="login-alert" class="text-center mb-3"></div>
                <form id="student-login-form" autocomplete="off">
                    <div class="mb-3">
                        <label for="studentId" class="form-label">Student ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-id-card text-secondary"></i></span>
                            <input type="text" class="form-control" id="studentId" placeholder="e.g., ELP250000" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password (Enrollment Date)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="YYYY-MM-DD" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-file-alt me-2"></i>View Results
                        </button>
                    </div>
                    <div class="login-footer">
                        <a href="/HTML/index.html"><i class="fas fa-arrow-left me-1"></i>Back to Website</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('student-login-form');
    // Load the student data saved by the admin panel
    const studentData = JSON.parse(localStorage.getItem('allStudents')) || [];

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const studentIdInput = document.getElementById('studentId').value;
        const passwordInput = document.getElementById('password').value;
        const loginAlert = document.getElementById('login-alert');
        loginAlert.innerHTML = '';

        // Find the student by ID (ignoring 'SA' prefix and case)
        const studentIdNum = parseInt(studentIdInput.replace(/SA/i, ''));
        const student = studentData.find(s => s.id === studentIdNum);
        
        // Check if the student exists and if the password matches their enrollmentDate
        if (student && student.enrollmentDate === passwordInput) {
            sessionStorage.setItem('viewingStudentId', student.id); // Save permission ticket
            window.location.href = 'student-result.html';
        } else {
            loginAlert.innerHTML = `<div class="alert alert-danger">Invalid Student ID or Password.</div>`;
        }
    });
});
</script>
</body>
</html>
