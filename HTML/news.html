<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Events | Elif Pu Collage</title>
    <link rel="icon" type="image/png" href="/images/ALIF.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/HTML/index.html"><img src="/images/ALIF.png" alt="Logo" style="width: 40px; height: 40px;"> Elif Pu Collage</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/HTML/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/HTML/admision.html">Admissions</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/HTML/news.html">News & Events</a></li>
                    <!-- <li class="nav-item"><a class="nav-link" href="/HTML/portal_login.html">Admin Portal</a></li> -->
                    <li class="nav-item"><a class="nav-link" href="/HTML/Student Results.html">Student Results</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- News Section -->
    <div class="container my-5 py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">News & Events</h1>
            <p class="lead text-muted">Stay up to date with the latest news and announcements from our school.</p>
        </div>
        <div id="news-container" class="row g-4">
            <!-- News articles will be loaded here by JavaScript -->
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-4">
        <div class="container"><p>&copy; 2024 Elif Pu Collage. All Rights Reserved.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('news-container');
            try {
                const response = await fetch('/api/news');
                const articles = await response.json();
                if (articles.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted fs-5">No news articles have been published yet.</p>';
                    return;
                }
                container.innerHTML = articles.map(article => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm">
                            <img src="${article.imageurl || '/images/default-news.jpg'}" class="card-img-top" alt="${article.title}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${article.title}</h5>
                                <p class="card-text text-muted flex-grow-1">${article.summary || article.content.substring(0, 120) + '...'}</p>
                                <a href="news-single.html?id=${article.id}" class="btn btn-primary mt-auto">Read More</a>
                            </div>
                            <div class="card-footer text-muted">
                                Published on ${article.publishdate}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p class="text-center text-danger">Could not load news articles.</p>';
                console.error('Fetch News Error:', error);
            }
        });
    </script>
</body>
</html>
